name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela runs antigas do mesmo PR quando chega um push novo — não faz sentido
# esperar CI de commit que já foi substituído (e economiza minutos de Actions).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # O CI não conecta em banco nenhum — não roda migration nem teste de
      # integração. Mas o `prisma generate` (no postinstall de apps/api) resolve
      # a config, e o prisma.config.ts exige que DATABASE_URL exista.
      #
      # Valor descartável de propósito. Se algum dia o CI precisar de banco de
      # verdade, use um service container em vez de apontar isto para algo real.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4

      # Antes do setup-node: o cache de pnpm do setup-node precisa que o pnpm
      # já exista. A versão vem do campo packageManager do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        # --frozen-lockfile: falha se o lockfile estiver dessincronizado do
        # package.json, em vez de "consertar" silenciosamente. É o ponto de ter
        # lockfile commitado.
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      # Build PRIMEIRO, antes de lint e typecheck.
      #
      # Os dois precisam do packages/shared compilado (dist + .d.ts): o
      # typecheck obviamente, e o lint porque as regras do typescript-eslint
      # são type-aware. Sem o dist, tudo que vem do @titan/shared resolve como
      # "error typed value" e o lint acusa no-unsafe-* em código correto.
      #
      # Localmente isso passa mesmo na ordem errada, porque o dist já existe de
      # um build anterior. Só quebra em clone limpo — ou seja, só no CI.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test
